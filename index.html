<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Konechiba Senpai</title>
<meta name="description" content="Konechiba Senpai — Eternal Production çatısı altında Türkçe anime dublaj sanatçısı. Tüm sosyal medya hesapları ve dublaj projeleri burada.">

<meta name="theme-color" content="#ff3333">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div id="loading-screen" class="loading-screen">
  <div class="loading-mark" aria-hidden="true"></div>
</div>

<div id="app-shell">

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="navbar-left">
      <button id="hamburger-btn" class="hamburger-btn" aria-label="Menüyü aç" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <div class="brand">Konechiba <span>Senpai</span></div>
    </div>
    <div class="navbar-right">
      <button id="theme-toggle-btn" class="theme-toggle-btn" aria-label="Temayı değiştir">
        <i class="fa-solid fa-moon" id="theme-icon"></i>
      </button>
    </div>
  </header>

  <!-- SIDE MENU -->
  <div id="side-overlay" class="side-overlay"></div>
  <nav id="side-menu" class="side-menu" aria-label="Ana menü">
    <div class="side-menu-header">
      <div class="brand">Konechiba <span>Senpai</span></div>
      <button id="side-menu-close" class="side-menu-close" aria-label="Menüyü kapat">✕</button>
    </div>
    <div class="side-menu-section">
      <p class="side-menu-title">Menü</p>
      <a href="index.html" class="side-menu-link active"><span class="icon">🏠</span> Ana Sayfa</a>
      <a href="dublaj.html" class="side-menu-link"><span class="icon">🎬</span> Dublajlarımız</a>
      <a href="sponsorlar.html" class="side-menu-link"><span class="icon">🤝</span> Sponsorlar</a>
    </div>
  </nav>

  <!-- MAIN -->
  <main class="page-content">
    <section class="hero">
      <img id="hero-logo" class="hero-logo" src="" alt="Konechiba Senpai logo" onerror="this.style.visibility='hidden'">
      <h1 id="hero-name" class="hero-name">&nbsp;</h1>
      <p id="hero-bio" class="hero-bio">&nbsp;</p>
    </section>

    <section id="social-grid" class="social-grid" aria-label="Sosyal medya hesapları">
      <!-- JS ile home.js'den otomatik oluşturulur -->
    </section>
  </main>

  <footer class="site-footer">
    <p>© 2026 Konechiba Senpai. All Rights Reserved.</p>
    <p>
      Powered by
      <a href="https://www.eternalproduction.net" target="_blank" rel="noopener noreferrer">
        Eternal Production
      </a>
    </p>
    <p>Made with <span>❤</span> for the Anime Community.</p>
  </footer>
</div>

<div id="toast-stack" class="toast-stack"></div>

<script src="js/common.js"></script>
<script src="js/home.js"></script>
</body>
</html>
